<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --bg-raised: #22223a;
    --bg-input: #16162a;
    --bg-sidebar: #161630;
    --border: #2a2a48;
    --border-focus: #6366f1;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --blue: #3b82f6;
    --radius: 6px;
    --radius-sm: 4px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, monospace;
    --sidebar-w: 220px;
  }

  body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    height: 100vh;
    display: flex;
  }

  /* ── Sidebar ── */

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-tab {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 4px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: color 0.12s, border-color 0.12s;
  }

  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .sidebar-panel { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
  .sidebar-panel.active { display: flex; }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    flex-shrink: 0;
  }

  .sidebar-header-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-dim);
  }

  .sidebar-action-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 8px;
    font-size: 11px;
    transition: border-color 0.12s, color 0.12s;
  }

  .sidebar-action-btn:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar-list { display: flex; flex-direction: column; gap: 1px; padding: 0 4px 8px; }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
    transition: background 0.12s;
    position: relative;
  }

  .sidebar-item:hover { background: rgba(255, 255, 255, 0.04); }
  .sidebar-item.active { background: rgba(99, 102, 241, 0.12); }

  .sidebar-item-method {
    font-weight: 700;
    font-size: 9px;
    text-transform: uppercase;
    min-width: 32px;
    flex-shrink: 0;
  }

  .sidebar-item-label {
    flex: 1;
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-item-status {
    font-size: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .sidebar-item-time {
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .sidebar-item-actions {
    display: none;
    flex-shrink: 0;
    gap: 2px;
  }

  .sidebar-item:hover .sidebar-item-actions { display: flex; }
  .sidebar-item:hover .sidebar-item-time { display: none; }

  .sidebar-item-action {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0 3px;
    font-size: 12px;
    line-height: 1;
  }

  .sidebar-item-action:hover { color: var(--red); }

  .sidebar-empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.5;
  }

  /* ── Save modal ── */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .modal-title { font-size: 14px; font-weight: 600; }

  .modal-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font-size: 13px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
  }

  .modal-input:focus { border-color: var(--border-focus); }

  .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }

  .modal-btn {
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font);
  }

  .modal-btn:hover { border-color: var(--text-dim); }

  .modal-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
  }

  .modal-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  /* ── Main area ── */

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-shrink: 0;
  }

  select, input, textarea, button {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .method-select {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    font-weight: 600;
    cursor: pointer;
    min-width: 90px;
  }

  .method-select:focus { border-color: var(--border-focus); }

  .url-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .url-input:focus { border-color: var(--border-focus); }
  .url-input::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    padding: 6px 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s;
  }

  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .save-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
    transition: border-color 0.12s, color 0.12s;
  }

  .save-btn:hover { border-color: var(--accent); color: var(--accent); }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 8px 14px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    transition: color 0.12s, border-color 0.12s;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-panels { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .tab-panel { display: none; flex: 1; overflow: auto; }
  .tab-panel.active { display: flex; flex-direction: column; }

  .kv-editor { padding: 8px; display: flex; flex-direction: column; gap: 4px; }

  .kv-row { display: flex; gap: 4px; align-items: center; }

  .kv-row input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 8px;
    font-family: var(--mono);
    font-size: 11px;
  }

  .kv-row input:focus { border-color: var(--border-focus); }
  .kv-row input::placeholder { color: var(--text-dim); }

  .kv-remove {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 6px;
    font-size: 14px;
    line-height: 1;
    border-radius: var(--radius-sm);
  }

  .kv-remove:hover { color: var(--red); background: rgba(239, 68, 68, 0.1); }

  .kv-add {
    background: none;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 11px;
    margin-top: 2px;
    transition: border-color 0.12s, color 0.12s;
  }

  .kv-add:hover { border-color: var(--accent); color: var(--accent); }

  .body-editor { flex: 1; padding: 8px; display: flex; flex-direction: column; }

  .body-type-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }

  .body-type-row label {
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .body-textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    resize: none;
    min-height: 80px;
  }

  .body-textarea:focus { border-color: var(--border-focus); }
  .body-textarea::placeholder { color: var(--text-dim); }

  .response-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .response-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 12px;
  }

  .status-badge {
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }

  .status-2xx { background: rgba(34, 197, 94, 0.15); color: var(--green); }
  .status-3xx { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
  .status-4xx { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
  .status-5xx { background: rgba(239, 68, 68, 0.15); color: var(--red); }

  .response-meta { color: var(--text-dim); font-size: 11px; }

  .response-body { flex: 1; overflow: auto; padding: 8px; }

  .response-body pre {
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
  }

  .response-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  .splitter {
    height: 3px;
    background: var(--border);
    cursor: row-resize;
    flex-shrink: 0;
    transition: background 0.12s;
  }

  .splitter:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" data-panel="collections">Collections</button>
    <button class="sidebar-tab" data-panel="history">History</button>
  </div>

  <div class="sidebar-panel active" data-panel="collections">
    <div class="sidebar-header">
      <span class="sidebar-header-label">Saved Requests</span>
      <button class="sidebar-action-btn" id="save-current-btn">+ Save</button>
    </div>
    <div class="sidebar-list" id="collections-list"></div>
  </div>

  <div class="sidebar-panel" data-panel="history">
    <div class="sidebar-header">
      <span class="sidebar-header-label">Recent</span>
      <button class="sidebar-action-btn" id="clear-history-btn">Clear</button>
    </div>
    <div class="sidebar-list" id="history-list"></div>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <select id="method" class="method-select">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="PATCH">PATCH</option>
      <option value="DELETE">DELETE</option>
      <option value="HEAD">HEAD</option>
      <option value="OPTIONS">OPTIONS</option>
    </select>
    <input id="url" class="url-input" type="text" placeholder="https://api.example.com/endpoint" spellcheck="false" />
    <button id="send" class="send-btn">Send</button>
  </div>

  <div class="content">
    <div class="tabs" id="request-tabs">
      <button class="tab active" data-panel="params">Params</button>
      <button class="tab" data-panel="headers">Headers</button>
      <button class="tab" data-panel="body">Body</button>
    </div>

    <div class="tab-panels" id="request-panels">
      <div class="tab-panel active" data-panel="params">
        <div class="kv-editor" id="params-editor"></div>
      </div>
      <div class="tab-panel" data-panel="headers">
        <div class="kv-editor" id="headers-editor"></div>
      </div>
      <div class="tab-panel" data-panel="body">
        <div class="body-editor">
          <div class="body-type-row">
            <label><input type="radio" name="body-type" value="none" checked /> None</label>
            <label><input type="radio" name="body-type" value="json" /> JSON</label>
            <label><input type="radio" name="body-type" value="text" /> Text</label>
            <label><input type="radio" name="body-type" value="form" /> Form</label>
          </div>
          <textarea id="body-content" class="body-textarea" placeholder="Request body..." disabled></textarea>
        </div>
      </div>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="response-section" id="response-section">
      <div class="response-empty" id="response-empty">Send a request to see the response</div>
      <div id="response-content" style="display:none">
        <div class="response-bar">
          <span class="status-badge" id="res-status"></span>
          <span class="response-meta" id="res-meta"></span>
        </div>
        <div class="tabs" id="response-tabs">
          <button class="tab active" data-panel="res-body">Body</button>
          <button class="tab" data-panel="res-headers">Headers</button>
        </div>
        <div class="tab-panels">
          <div class="tab-panel active" data-panel="res-body">
            <div class="response-body"><pre id="res-body-pre"></pre></div>
          </div>
          <div class="tab-panel" data-panel="res-headers">
            <div class="response-body"><pre id="res-headers-pre"></pre></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal-container"></div>

<script>
(function () {
  var METHOD_COLORS = {
    GET: '#22c55e', POST: '#3b82f6', PUT: '#f59e0b',
    PATCH: '#f59e0b', DELETE: '#ef4444', HEAD: '#8b5cf6', OPTIONS: '#8b5cf6'
  }

  var methodEl = document.getElementById('method')
  var urlEl = document.getElementById('url')
  var sendBtn = document.getElementById('send')
  var bodyContent = document.getElementById('body-content')
  var resEmpty = document.getElementById('response-empty')
  var resContent = document.getElementById('response-content')
  var resStatus = document.getElementById('res-status')
  var resMeta = document.getElementById('res-meta')
  var resBodyPre = document.getElementById('res-body-pre')
  var resHeadersPre = document.getElementById('res-headers-pre')
  var collectionsListEl = document.getElementById('collections-list')
  var historyListEl = document.getElementById('history-list')
  var modalContainer = document.getElementById('modal-container')

  var params = [{ key: '', value: '' }]
  var headers = [{ key: 'Content-Type', value: 'application/json' }]
  var history = []
  var collections = []
  var bodyType = 'none'

  /* ── Sidebar tabs ── */

  var sidebarTabs = document.querySelectorAll('.sidebar-tab')
  var sidebarPanels = document.querySelectorAll('.sidebar-panel')

  sidebarTabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      var panelName = tab.dataset.panel

      sidebarTabs.forEach(function (t) { t.classList.toggle('active', t === tab) })
      sidebarPanels.forEach(function (p) { p.classList.toggle('active', p.dataset.panel === panelName) })
    })
  })

  /* ── Tabs ── */

  function setupTabs(container) {
    var tabs = container.querySelectorAll('.tab')

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        var panelName = tab.dataset.panel
        var panelsContainer = container.nextElementSibling

        container.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t === tab)
        })

        if (panelsContainer) {
          panelsContainer.querySelectorAll('.tab-panel').forEach(function (p) {
            p.classList.toggle('active', p.dataset.panel === panelName)
          })
        }
      })
    })
  }

  setupTabs(document.getElementById('request-tabs'))
  setupTabs(document.getElementById('response-tabs'))

  /* ── Bridge ── */

  var pending = {}
  var callId = 0

  function bridge(method, args) {
    var id = 'c' + (++callId)

    window.parent.postMessage({
      type: 'agentgrid-extension-call',
      id: id,
      method: method,
      args: args || []
    }, '*')

    return new Promise(function (resolve) { pending[id] = resolve })
  }

  window.addEventListener('message', function (e) {
    var d = e.data

    if (d && d.type === 'agentgrid-extension-response' && d.id && pending[d.id]) {
      pending[d.id](d.result)
      delete pending[d.id]
    }

    if (d && d.type === 'ext-pane:broadcast' && d.event && d.event.type === 'response') {
      showResponse(d.event)
      persistHistory(d.event.method || '?', d.event.url || '?', d.event.status)
    }
  })

  /* ── KV Editor ── */

  function clearChildren(el) {
    while (el.firstChild) { el.removeChild(el.firstChild) }
  }

  function renderKvEditor(containerId, items) {
    var container = document.getElementById(containerId)

    clearChildren(container)

    items.forEach(function (item, i) {
      var row = document.createElement('div')

      row.className = 'kv-row'

      var keyInput = document.createElement('input')

      keyInput.type = 'text'
      keyInput.placeholder = 'Key'
      keyInput.value = item.key
      keyInput.addEventListener('input', function () { items[i].key = this.value })

      var valInput = document.createElement('input')

      valInput.type = 'text'
      valInput.placeholder = 'Value'
      valInput.value = item.value
      valInput.addEventListener('input', function () { items[i].value = this.value })

      var removeBtn = document.createElement('button')

      removeBtn.className = 'kv-remove'
      removeBtn.textContent = '\u2715'
      removeBtn.addEventListener('click', function () {
        items.splice(i, 1)

        if (items.length === 0) { items.push({ key: '', value: '' }) }

        renderKvEditor(containerId, items)
      })

      row.appendChild(keyInput)
      row.appendChild(valInput)
      row.appendChild(removeBtn)
      container.appendChild(row)
    })

    var addBtn = document.createElement('button')

    addBtn.className = 'kv-add'
    addBtn.textContent = '+ Add'
    addBtn.addEventListener('click', function () {
      items.push({ key: '', value: '' })
      renderKvEditor(containerId, items)
    })

    container.appendChild(addBtn)
  }

  renderKvEditor('params-editor', params)
  renderKvEditor('headers-editor', headers)

  /* ── Body type ── */

  document.querySelectorAll('input[name="body-type"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      bodyType = this.value
      bodyContent.disabled = bodyType === 'none'

      var placeholders = { json: '{\n  "key": "value"\n}', form: 'key=value&other=data', text: 'Plain text body...' }

      bodyContent.placeholder = placeholders[bodyType] || 'Request body...'
    })
  })

  methodEl.addEventListener('change', function () {
    methodEl.style.color = METHOD_COLORS[methodEl.value] || '#e0e0e0'
  })

  methodEl.style.color = METHOD_COLORS[methodEl.value] || '#e0e0e0'

  /* ── Request building ── */

  function buildUrl() {
    var base = urlEl.value.trim()

    if (!base) { return '' }

    var activeParams = params.filter(function (p) { return p.key.trim() })

    if (activeParams.length === 0) { return base }

    var sep = base.indexOf('?') === -1 ? '?' : '&'
    var qs = activeParams.map(function (p) {
      return encodeURIComponent(p.key) + '=' + encodeURIComponent(p.value)
    }).join('&')

    return base + sep + qs
  }

  function buildHeaders() {
    var h = {}

    headers.forEach(function (item) {
      if (item.key.trim()) { h[item.key.trim()] = item.value }
    })

    return h
  }

  /* ── Response ── */

  function statusClass(code) {
    if (code >= 200 && code < 300) { return 'status-2xx' }
    if (code >= 300 && code < 400) { return 'status-3xx' }
    if (code >= 400 && code < 500) { return 'status-4xx' }

    return 'status-5xx'
  }

  function formatBody(text, contentType) {
    if (contentType && contentType.indexOf('json') !== -1) {
      try { return JSON.stringify(JSON.parse(text), null, 2) } catch (_) { return text }
    }

    return text
  }

  function formatSize(bytes) {
    if (bytes < 1024) { return bytes + ' B' }
    if (bytes < 1024 * 1024) { return (bytes / 1024).toFixed(1) + ' KB' }

    return (bytes / (1024 * 1024)).toFixed(1) + ' MB'
  }

  function showResponse(data) {
    resEmpty.style.display = 'none'
    resContent.style.display = 'flex'
    resContent.style.flexDirection = 'column'
    resContent.style.flex = '1'
    resContent.style.overflow = 'hidden'

    resStatus.textContent = data.status + ' ' + data.statusText
    resStatus.className = 'status-badge ' + statusClass(data.status)

    var parts = []

    if (data.time) { parts.push(data.time + 'ms') }
    if (data.size) { parts.push(formatSize(data.size)) }

    resMeta.textContent = parts.join(' \u00b7 ')

    var ct = (data.headers && data.headers['content-type']) || ''

    resBodyPre.textContent = formatBody(data.body, ct)

    var headerLines = ''

    if (data.headers) {
      Object.keys(data.headers).forEach(function (k) {
        headerLines += k + ': ' + data.headers[k] + '\n'
      })
    }

    resHeadersPre.textContent = headerLines || '(no headers)'
  }

  function showError(err) {
    resEmpty.style.display = 'none'
    resContent.style.display = 'flex'
    resContent.style.flexDirection = 'column'
    resContent.style.flex = '1'

    resStatus.textContent = 'Error'
    resStatus.className = 'status-badge status-5xx'
    resMeta.textContent = ''
    resBodyPre.textContent = err
    resHeadersPre.textContent = ''
  }

  /* ── History (persistent) ── */

  function persistHistory(method, url, status, time) {
    history.unshift({ method: method, url: url, status: status, time: time || 0 })

    if (history.length > 100) { history.pop() }

    renderHistory()

    bridge('executeCommand', ['api-playground.pushHistory', {
      method: method, url: url, status: status, time: time || 0
    }])
  }

  function renderHistory() {
    clearChildren(historyListEl)

    if (history.length === 0) {
      var empty = document.createElement('div')

      empty.className = 'sidebar-empty'
      empty.textContent = 'No requests yet.\nSend a request to start building history.'
      historyListEl.appendChild(empty)

      return
    }

    history.forEach(function (entry) {
      var btn = document.createElement('button')

      btn.className = 'sidebar-item'

      var methodSpan = document.createElement('span')

      methodSpan.className = 'sidebar-item-method'
      methodSpan.textContent = entry.method
      methodSpan.style.color = METHOD_COLORS[entry.method] || '#888'

      var urlSpan = document.createElement('span')

      urlSpan.className = 'sidebar-item-label'

      try {
        var parsed = new URL(entry.url)

        urlSpan.textContent = parsed.pathname + parsed.search
      } catch (_) {
        urlSpan.textContent = entry.url
      }

      urlSpan.title = entry.url

      var statusSpan = document.createElement('span')

      statusSpan.className = 'sidebar-item-status'
      statusSpan.textContent = entry.status || ''

      var statusColor = '#22c55e'

      if (entry.status === 'ERR') { statusColor = '#ef4444' }
      else if (entry.status >= 400) { statusColor = '#ef4444' }
      else if (entry.status >= 300) { statusColor = '#f59e0b' }

      statusSpan.style.color = statusColor

      btn.appendChild(methodSpan)
      btn.appendChild(urlSpan)
      btn.appendChild(statusSpan)

      btn.addEventListener('click', function () {
        loadRequest(entry.method, entry.url)
      })

      historyListEl.appendChild(btn)
    })
  }

  function loadPersistedHistory() {
    bridge('executeCommand', ['api-playground.getHistory']).then(function (result) {
      if (Array.isArray(result)) {
        history = result
        renderHistory()
      }
    })
  }

  document.getElementById('clear-history-btn').addEventListener('click', function () {
    history = []
    renderHistory()
  })

  /* ── Collections (persistent) ── */

  function renderCollections() {
    clearChildren(collectionsListEl)

    if (collections.length === 0) {
      var empty = document.createElement('div')

      empty.className = 'sidebar-empty'
      empty.textContent = 'No saved requests yet.\nClick "+ Save" to save the current request.'
      collectionsListEl.appendChild(empty)

      return
    }

    collections.forEach(function (entry) {
      var btn = document.createElement('button')

      btn.className = 'sidebar-item'

      var methodSpan = document.createElement('span')

      methodSpan.className = 'sidebar-item-method'
      methodSpan.textContent = entry.method
      methodSpan.style.color = METHOD_COLORS[entry.method] || '#888'

      var nameSpan = document.createElement('span')

      nameSpan.className = 'sidebar-item-label'
      nameSpan.textContent = entry.name
      nameSpan.title = entry.url

      var actionsSpan = document.createElement('span')

      actionsSpan.className = 'sidebar-item-actions'

      var deleteBtn = document.createElement('button')

      deleteBtn.className = 'sidebar-item-action'
      deleteBtn.textContent = '\u2715'
      deleteBtn.title = 'Delete'
      deleteBtn.addEventListener('click', function (ev) {
        ev.stopPropagation()
        deleteCollection(entry.id)
      })

      actionsSpan.appendChild(deleteBtn)

      btn.appendChild(methodSpan)
      btn.appendChild(nameSpan)
      btn.appendChild(actionsSpan)

      btn.addEventListener('click', function () {
        loadSavedRequest(entry)
      })

      collectionsListEl.appendChild(btn)
    })
  }

  function loadSavedRequest(entry) {
    methodEl.value = entry.method || 'GET'
    methodEl.style.color = METHOD_COLORS[methodEl.value] || '#e0e0e0'
    urlEl.value = entry.url || ''

    if (entry.headers && entry.headers.length) {
      headers = entry.headers.map(function (h) { return { key: h.key, value: h.value } })
    } else {
      headers = [{ key: 'Content-Type', value: 'application/json' }]
    }

    renderKvEditor('headers-editor', headers)

    params = [{ key: '', value: '' }]
    renderKvEditor('params-editor', params)

    bodyType = entry.bodyType || 'none'
    bodyContent.value = entry.body || ''
    bodyContent.disabled = bodyType === 'none'

    document.querySelectorAll('input[name="body-type"]').forEach(function (radio) {
      radio.checked = radio.value === bodyType
    })
  }

  function loadRequest(method, url) {
    methodEl.value = method
    methodEl.style.color = METHOD_COLORS[method] || '#e0e0e0'
    urlEl.value = url
  }

  function showSaveModal() {
    var currentUrl = urlEl.value.trim()

    if (!currentUrl) {
      urlEl.focus()

      return
    }

    var overlay = document.createElement('div')

    overlay.className = 'modal-overlay'

    var modal = document.createElement('div')

    modal.className = 'modal'

    var title = document.createElement('div')

    title.className = 'modal-title'
    title.textContent = 'Save Request'

    var nameInput = document.createElement('input')

    nameInput.className = 'modal-input'
    nameInput.type = 'text'
    nameInput.placeholder = 'Request name...'

    try {
      var parsed = new URL(currentUrl.indexOf('://') === -1 ? 'https://' + currentUrl : currentUrl)

      nameInput.value = methodEl.value + ' ' + parsed.pathname
    } catch (_) {
      nameInput.value = methodEl.value + ' ' + currentUrl.slice(0, 40)
    }

    var buttons = document.createElement('div')

    buttons.className = 'modal-buttons'

    var cancelBtn = document.createElement('button')

    cancelBtn.className = 'modal-btn'
    cancelBtn.textContent = 'Cancel'

    var saveBtn = document.createElement('button')

    saveBtn.className = 'modal-btn modal-btn-primary'
    saveBtn.textContent = 'Save'

    buttons.appendChild(cancelBtn)
    buttons.appendChild(saveBtn)
    modal.appendChild(title)
    modal.appendChild(nameInput)
    modal.appendChild(buttons)
    overlay.appendChild(modal)
    modalContainer.appendChild(overlay)

    nameInput.focus()
    nameInput.select()

    function close() {
      modalContainer.removeChild(overlay)
    }

    cancelBtn.addEventListener('click', close)

    overlay.addEventListener('click', function (ev) {
      if (ev.target === overlay) { close() }
    })

    function doSave() {
      var name = nameInput.value.trim()

      if (!name) { return }

      var entry = {
        id: 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        name: name,
        method: methodEl.value,
        url: currentUrl,
        headers: headers.filter(function (h) { return h.key.trim() }),
        bodyType: bodyType,
        body: bodyContent.value,
        createdAt: Date.now()
      }

      bridge('executeCommand', ['api-playground.saveCollection', entry]).then(function (result) {
        if (result && result.collections) {
          collections = result.collections
        } else {
          collections.unshift(entry)
        }

        renderCollections()
      })

      close()
    }

    saveBtn.addEventListener('click', doSave)

    nameInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { doSave() }
      if (ev.key === 'Escape') { close() }
    })
  }

  function deleteCollection(id) {
    bridge('executeCommand', ['api-playground.deleteCollection', id]).then(function (result) {
      if (result && result.collections) {
        collections = result.collections
      } else {
        collections = collections.filter(function (c) { return c.id !== id })
      }

      renderCollections()
    })
  }

  function loadPersistedCollections() {
    bridge('executeCommand', ['api-playground.getCollections']).then(function (result) {
      if (Array.isArray(result)) {
        collections = result
        renderCollections()
      }
    })
  }

  document.getElementById('save-current-btn').addEventListener('click', showSaveModal)

  /* ── Send request ── */

  function sendRequest() {
    var method = methodEl.value
    var url = buildUrl()

    if (!url) { urlEl.focus(); return }

    if (!/^https?:\/\//i.test(url)) { url = 'https://' + url }

    sendBtn.disabled = true
    sendBtn.textContent = 'Sending...'

    var startTime = Date.now()
    var reqHeaders = buildHeaders()
    var reqBody = bodyType === 'none' ? undefined : bodyContent.value

    bridge('executeCommand', ['api-playground.httpRequest', {
      method: method,
      url: url,
      headers: reqHeaders,
      body: reqBody
    }]).then(function (result) {
      sendBtn.disabled = false
      sendBtn.textContent = 'Send'

      if (!result || result.error) {
        showError(result ? result.error : 'No response')
        persistHistory(method, url, 'ERR')

        return
      }

      var elapsed = Date.now() - startTime

      result.time = elapsed
      showResponse(result)
      persistHistory(method, url, result.status, elapsed)
    }).catch(function () {
      sendBtn.disabled = false
      sendBtn.textContent = 'Send'
      showError('Bridge communication failed')
    })
  }

  sendBtn.addEventListener('click', sendRequest)

  urlEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { sendRequest() }
  })

  /* ── Splitter ── */

  var splitter = document.getElementById('splitter')
  var isDragging = false

  splitter.addEventListener('mousedown', function (e) {
    isDragging = true
    e.preventDefault()
  })

  document.addEventListener('mousemove', function (e) {
    if (!isDragging) { return }

    var container = document.querySelector('.content')
    var rect = container.getBoundingClientRect()
    var y = e.clientY - rect.top
    var pct = Math.max(20, Math.min(80, (y / rect.height) * 100))
    var panels = document.getElementById('request-panels')

    panels.style.flex = 'none'
    panels.style.height = pct + '%'
    document.getElementById('response-section').style.flex = '1'
  })

  document.addEventListener('mouseup', function () { isDragging = false })

  /* ── Init: load persisted data ── */

  loadPersistedCollections()
  loadPersistedHistory()
  renderCollections()
  renderHistory()
})()
</script>
</body>
</html>
